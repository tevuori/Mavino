services:
  db:
    image: postgres:16-alpine
    container_name: mavino-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena}
    volumes:
      - athena-pgdata:/var/lib/postgresql/data
    ports:
      # Expose to host for local dev (bun run dev:server connects to localhost:5432).
      - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-athena} -d ${POSTGRES_DB:-athena}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mavino-redis
    ports:
      # Expose to host for local dev (bun run dev:server connects to localhost:6379).
      - "127.0.0.1:6379:6379"
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Persist Redis data so rate limits survive restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - athena-redis:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mavino-server
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-athena}:${POSTGRES_PASSWORD:-athena}@db:5432/${POSTGRES_DB:-athena}?schema=public"
      REDIS_URL: "redis://redis:6379"
      # JWT_SECRET must be set — generate with: openssl rand -hex 32
      # The server refuses to start in production without a secure secret (>= 32 chars).
      JWT_SECRET: ${JWT_SECRET:-}
      # ENCRYPTION_KEY is used for AES-256-GCM encryption of stored credentials
      # (VUT passwords, API keys, OAuth tokens, TOTP secrets). Should be a
      # separate secret from JWT_SECRET for key separation. Generate with:
      #   openssl rand -hex 32
      # If unset, falls back to JWT_SECRET (with a warning) for backward compat.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      # SEED_PASSWORD: if unset or "admin" in production, the seed script
      # generates a strong random password and prints it once. The seeded user
      # is forced to change it on first login.
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Comma-separated list of allowed CORS origins. For a single-origin public
      # deploy behind the host nginx, set this to the public URL.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-https://mavino.net/auth/spotify/callback}
      # Mavino code execution sandbox (run_code tool). Uses gVisor (runsc)
      # runtime for kernel-level isolation — safe for public multi-user hosts.
      # Requires the Docker socket mounted below + runsc installed on the host.
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-runsc}
      # Shared temp directory for sandbox code files. Must be the same path on
      # both the host and this container so the Docker daemon can resolve -v
      # mounts when spawning sandbox containers via the socket.
      SANDBOX_HOST_TMP: /tmp/mavino-sandbox
    volumes:
      - athena-uploads:/app/uploads
      # Docker socket for the Mavino code execution sandbox (run_code tool).
      # Safe when combined with the gVisor (runsc) runtime — sandbox containers
      # run inside a userspace kernel that intercepts syscalls, preventing
      # container escape to the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared temp dir for sandbox code files (same path on host + container).
      - /tmp/mavino-sandbox:/tmp/mavino-sandbox
    restart: unless-stopped
    healthcheck:
      # The server exposes GET /health returning {"ok": true}.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mavino-client
    ports:
      # Bind to localhost only — the host nginx terminates TLS and proxies to this.
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # nginx:alpine includes wget — check the SPA root responds.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  athena-pgdata:
  athena-redis:
  athena-uploads:
