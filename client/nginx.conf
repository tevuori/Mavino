# Production nginx config for the Mavino client container.
# Serves the built SPA and reverse-proxies /api to the server container.
# The host-level nginx (deploy/nginx/mavino.net.conf) terminates TLS
# and forwards everything to this container's :80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= the Bun server's maxRequestBodySize (server/src/index.ts,
    # 2 GB — needed for lecture video uploads) and the host-level nginx's
    # client_max_body_size (deploy/nginx/mavino.net.conf). nginx
    # defaults to 1m, which silently 413s any upload above that before it
    # reaches the Bun/Hono server — large file uploads would fail with a
    # raw nginx error page and never get saved.
    client_max_body_size 2g;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # API → backend server container (Docker network DNS: "server").
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / long-lived streams (Mavino chat, ntfy) — disable buffering + long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Microsoft OAuth2 callback → server (public, no auth middleware).
    # Must be proxied to the server so it can exchange the auth code for tokens.
    location = /auth/callback {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — index.html must never be cached so new deploys
    # (with new hashed JS/CSS filenames) are picked up immediately.
    #
    # CRITICAL: The no-cache headers MUST be on this location block, not
    # only on `location = /index.html`. When a user visits "/" (the root
    # URL), nginx serves index.html via try_files *inside this block* —
    # the `location = /index.html` headers are never applied to that
    # request. Without no-cache here, the browser caches the stale
    # index.html, which references old chunk filenames that no longer
    # exist after a deploy → "Failed to fetch dynamically imported module"
    # errors.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Content-hashed assets — safe to cache forever. The filenames change
    # on every build so stale caches never serve outdated code.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
