# Production nginx config for the Mavino client container.
# Serves the built SPA and reverse-proxies /api to the server container.
# The host-level nginx (deploy/nginx/athena.tevuori.eu.conf) terminates TLS
# and forwards everything to this container's :80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= the Bun server's maxRequestBodySize (server/src/index.ts,
    # 2 GB — needed for lecture video uploads) and the host-level nginx's
    # client_max_body_size (deploy/nginx/athena.tevuori.eu.conf). nginx
    # defaults to 1m, which silently 413s any upload above that before it
    # reaches the Bun/Hono server — large file uploads would fail with a
    # raw nginx error page and never get saved.
    client_max_body_size 2g;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # API → backend server container (Docker network DNS: "server").
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / long-lived streams (Mavino chat, ntfy) — disable buffering + long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Microsoft OAuth2 callback → server (public, no auth middleware).
    # Must be proxied to the server so it can exchange the auth code for tokens.
    location = /auth/callback {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — index.html must never be cached so new deploys
    # (with new hashed JS/CSS filenames) are picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
