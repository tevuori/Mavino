# Host-level nginx site for mavino.net.
# Terminates TLS (certbot) and proxies everything to the Mavino client
# container bound at 127.0.0.1:8080. The client container's nginx then
# serves the SPA and reverse-proxies /api to the server container.
#
# Install:  sudo cp deploy/nginx/mavino.net.conf /etc/nginx/sites-available/mavino.net
#           sudo ln -s /etc/nginx/sites-available/mavino.net /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then:     sudo certbot --nginx -d mavino.net

server {
    listen 80;
    server_name mavino.net;

    # Certbot will manage the TLS block (rewrite to 443 + ssl). Keep this
    # location so the HTTP→HTTPS redirect works before certbot runs.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mavino.net;

    # Certbot fills these in:
    # ssl_certificate /etc/letsencrypt/live/mavino.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mavino.net/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    # HSTS: enforce HTTPS for 1 year, include subdomains, preload-ready.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevent clickjacking — Mavino is not embeddable in iframes.
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-type sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer policy — only send origin to same-origin, none to cross-origin.
    add_header Referrer-Policy "same-origin" always;
    # Permissions policy — restrict access to sensitive browser APIs.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), interest-cohort=()" always;
    # CSP — allow self + inline styles (Tailwind/Vite injects them) + mapy.com tiles + data: images + Cloudflare Turnstile.
    # frame-src 'self' is needed for PDF viewer, Browser, VUT, and Teach iframes (all same-origin proxies).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.mapy.com https://api.mapy.com; font-src 'self' data:; connect-src 'self' https://api.mapy.com https://api.elevenlabs.io https://api.openai.com https://api.anthropic.com https://openrouter.ai https://api.deepseek.com https://api.groq.com https://api.mistral.ai https://generativelanguage.googleapis.com https://api.x.ai https://api.spotify.com https://lrclib.net https://ntfy.sh https://challenges.cloudflare.com; media-src 'self' blob: https://p.scdn.co; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Must match the client container's nginx (client/nginx.conf) and the
    # Bun server's maxRequestBodySize (server/src/index.ts, 2 GB — needed
    # for lecture video uploads). Otherwise large uploads 413 here before
    # ever reaching the app and the file is never saved.
    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / long-lived streams (Mavino chat, ntfy) — disable buffering + long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
