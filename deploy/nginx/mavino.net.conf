# Host-level nginx site for mavino.net.
# Terminates TLS (certbot) and proxies everything to the Mavino client
# container bound at 127.0.0.1:8080. The client container's nginx then
# serves the SPA and reverse-proxies /api to the server container.
#
# Install:  sudo cp deploy/nginx/mavino.net.conf /etc/nginx/sites-available/mavino.net
#           sudo ln -s /etc/nginx/sites-available/mavino.net /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then:     sudo certbot --nginx -d mavino.net

server {
    listen 80;
    server_name mavino.net;

    # Certbot will manage the TLS block (rewrite to 443 + ssl). Keep this
    # location so the HTTP→HTTPS redirect works before certbot runs.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mavino.net;

    # Certbot fills these in:
    # ssl_certificate /etc/letsencrypt/live/mavino.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mavino.net/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Must match the client container's nginx (client/nginx.conf) and the
    # Bun server's maxRequestBodySize (server/src/index.ts, 2 GB — needed
    # for lecture video uploads). Otherwise large uploads 413 here before
    # ever reaching the app and the file is never saved.
    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / long-lived streams (Mavino chat, ntfy) — disable buffering + long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
